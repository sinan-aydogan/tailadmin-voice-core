services:
  # ==============================================================================
  # Service 1: Isolated Python AI Engine (FastAPI + PyTorch + CUDA/CPU)
  # ==============================================================================
  voice-core-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: voice-core-engine
    restart: unless-stopped
    ports:
      - "${ENGINE_PORT:-5001}:5001"
    volumes:
      # Persistent storage for AI models, output audios, and voice profiles
      - ./data:/app/data
      - ./logs/engine:/app/logs
    environment:
      # GPU / CUDA Configuration
      - USE_GPU=${USE_GPU:-auto}
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      # Cache paths inside persistent volume
      - HF_HOME=/app/data/models/.cache/huggingface
      - TORCH_HOME=/app/data/models/.cache/torch
      # Python settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - voice-core-network

  # ==============================================================================
  # Service 2: Main Application (Web Dashboard + REST API + Laravel Queue Worker)
  # ==============================================================================
  voice-core-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voice-core-app
    restart: unless-stopped
    ports:
      # Main entrypoint: Web UI (Inertia Vue 3) & REST API (/api/v1/...)
      - "${PORT:-8000}:8000"
    volumes:
      # Shared data volume with engine (audio outputs, profiles, models)
      - ./data:/app/data
      # Persistent SQLite database & application storage
      - ./database:/app/database
      - ./storage:/app/storage
    environment:
      - PORT=8000
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY:-}
      - DB_CONNECTION=sqlite
      - QUEUE_CONNECTION=database
      # Connect to the Python AI engine container via internal Docker network
      - PYTHON_VOICE_URL=http://voice-core-engine:5001
      # Optional API key protection for external REST clients
      - VOICE_CORE_API_KEY=${VOICE_CORE_API_KEY:-}
    depends_on:
      voice-core-engine:
        condition: service_healthy
    networks:
      - voice-core-network

networks:
  voice-core-network:
    driver: bridge
