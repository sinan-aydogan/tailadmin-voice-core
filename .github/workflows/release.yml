name: Release Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os_name }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os_name: Windows
            build_target: win
            arch: x64
          - os: ubuntu-latest
            os_name: Linux
            build_target: linux
            arch: x64
          - os: macos-latest
            os_name: macOS
            build_target: mac
            arch: arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, zip, fileinfo
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Copy .env
        shell: bash
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Apply NativePHP Patches
        shell: bash
        run: |
          mkdir -p vendor/nativephp/desktop/resources/electron/electron-plugin/dist/server
          cp -f patches/pdfPageSize.js vendor/nativephp/desktop/resources/electron/electron-plugin/dist/server/pdfPageSize.js
          ls -la vendor/nativephp/desktop/resources/electron/electron-plugin/dist/server/pdfPageSize.js

      - name: Generate Application Key
        run: php artisan key:generate --force

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Build NativePHP Application
        env:
          NATIVEPHP_APP_VERSION: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || '1.0.0' }}
          NATIVEPHP_BUILDING: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: php artisan native:build ${{ matrix.build_target }} ${{ matrix.arch }} --no-interaction

      - name: Verify Build Output
        shell: bash
        run: |
          echo "=== Searching for generated installer / executable files ==="
          find . -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" \) -not -path "*/node_modules/*" -not -path "*/vendor/*" -ls || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nativephp-build-${{ matrix.os_name }}-${{ matrix.arch }}
          path: |
            nativephp/electron/dist/*.exe
            nativephp/electron/dist/*.AppImage
            nativephp/electron/dist/*.deb
            nativephp/electron/dist/*.dmg
            nativephp/electron/dist/*.zip
            nativephp/electron/dist/*.blockmap
            **/dist/*.exe
            **/dist/*.AppImage
            **/dist/*.deb
            **/dist/*.dmg
            **/dist/*.zip
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p dist-all
          find release-artifacts -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" \) -exec cp {} dist-all/ \;
          TAG="${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.0.0' }}"
          if [ -f dist-all/electron.exe ]; then
            mv dist-all/electron.exe "dist-all/Voice-Core-${TAG}-Windows-x64.exe"
          fi
          if [ -f dist-all/voice-core.exe ]; then
            mv dist-all/voice-core.exe "dist-all/Voice-Core-${TAG}-Windows-x64.exe"
          fi
          echo "=== Release Files ==="
          ls -la dist-all/
          if [ -z "$(ls -A dist-all)" ]; then
            echo "Error: No release binary files found in release-artifacts!"
            exit 1
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          name: Voice Core Release ${{ github.ref_name != '' && startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-all/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
