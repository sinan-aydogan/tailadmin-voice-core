# Docker Compose Override for CPU-Only Environments / macOS Docker Desktop
# Usage on CPU-only machines:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml up -d
#
# Or export COMPOSE_FILE:
#   export COMPOSE_FILE=docker-compose.yml:docker-compose.override.yml

services:
  voice-core-engine:
    # Disable NVIDIA GPU reservations for CPU-only execution
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    environment:
      - USE_GPU=cpu
      - NVIDIA_VISIBLE_DEVICES=void
      - CUDA_VISIBLE_DEVICES=""
